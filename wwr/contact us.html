<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Co.</title>
    <meta name="description" content="Reach Us white water rafting company,for general inquries,Reservation Question, ">
    <meta name="author" content="Wycliff Byakagaba">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

<header class="header-grid">
    <img src="images/log.jpeg" alt="White Water Rafting Company Logo" width="100" height="100">
    <nav class="main-nav" aria-label="Main site navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
    </nav>
</header>

<main>
    <h1>Contact Us</h1>

    <!-- Company Info + Map -->
    <section class="contact-layout">
        <div class="company-info">
            <h2>Our Office</h2>
            <p><strong>Address:</strong> 123 River Road, Jinja City, Uganda</p>
            <p><strong>Phone:</strong> +256 778 436 415</p>
            <p><strong>Email:</strong> info@whitewaterrafting.com</p>
        </div>

        <div class="map">
            <iframe
                src="https://www.google.com/maps?q=Jinja%20White%20Water%20Rafting%20Uganda&output=embed"
                loading="lazy"
                title="Map showing White Water Rafting in Jinja, Uganda">
            </iframe>
        </div>
    </section>

    <!-- Employees -->
    <section class="employees">
        <h2>Meet Our Team</h2>

        <figure>
            <img src="images/employee1.jpg" alt="Olak Peter, Lead Rafting Guide">
            <figcaption>Olak Peter – Lead Rafting Guide</figcaption>
        </figure>

        <figure>
            <img src="images/employee2.jpg" alt="Sarah Namanzi, River Instructor">
            <figcaption>Sarah Namanzi – River Instructor</figcaption>
        </figure>

        <figure>
            <img src="images/employee3.jpg" alt="Asimwe Micheal, Safety Officer">
            <figcaption>Asimwe Micheal – Safety Officer</figcaption>
        </figure>
    </section>

  <main>
   <section class="contact-form">
    <h2>Send Us a Message</h2>
    <form action="#" method="post">

      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" Byakagaba Wycliff>

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" wycliffbyakagaba@gmail.com>

      <fieldset>
        <legend>Purpose of Contact</legend>
        <label><input type="radio" id="general" name="purpose" value="general" required> General Inquiry</label>
        <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
        <label><input type="radio" id="website" name="purpose" value="website"> Website Suggestion</label>
      </fieldset>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <label>
        <input type="checkbox" id="newsletter" name="newsletter">
        Subscribe to our newsletter
      </label>

      <button type="submit">subscribe</button> 
    </form>
  </section>
</main>
  

<footer>
    <p>© 2026 White Water Rafting | Byakagaba Wycliff</p>

    <nav class="socialmedia" aria-label="Social media links">
        <a href="https://facebook.com">
            <img src="images/facebook.jpeg" alt="Facebook" width="32" height="32">
        </a>
        <a href="https://linkedin.com">
            <img src="images/linkin.jpeg" alt="LinkedIn" width="32" height="32">
        </a>
        <a href="https://instagram.com">
            <img src="images/instagram.jpeg" alt="Instagram" width="32" height="32">
        </a>
    </nav>
</footer>

</body>
</html>
