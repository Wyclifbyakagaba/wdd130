<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Company.</title>
    <meta name="description" 
    content="Contact white water Rafting Company for inquiries, reservations, or customer support. Reach us by phone, email, or visit our location.">
   <meta name="author" content="Wycliff Byakagaba">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

  <header class="header-grid">
     <img src="images/log.jpeg" alt="White Water Rafting Company Logo" width="100" height="100">
     <nav class="main-nav" aria-label="Main site navigation">
         <a href="index.html">Home</a>
         <a href="about.html">About Us</a>
         <a href="trips.html">Trips</a>
         <a href="contact.html">Contact Us</a>
     </nav>
  </header>

   <main>
       <aside class="company-info">
            <div>
               <h1>White water Rafting Company</h1>
               <p>Address: 123 main River street</p>
               <p>Jinja City, Uganda</p>
               <p>Phone: +256 778 436 415</p>
               <p>Email: info@whitewaterrafting.com</p>
            </div>
       </aside>
       <div class="contact-section">
             <iframe class="map"
                src="https://www.google.com/maps?q=Jinja%20White%20Water%20Rafting%20Uganda&output=embed"
                width="400%" height="300" loading="lazy"
                title="Map showing White Water Rafting in Jinja, Uganda">
             
           
              <form action="#" method="post">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email">
                   <fieldset>
                     <legend>messege purpose</legend>
                     <label for="level1">
                        <input type="radio" id="level1" name="level">
                         General Inquiry</label>

                     <label for="level2">
                        <input type="radio" id="level2 name=level">
                         Reservation Question</label>

                     <label for="level3">
                        <input type="radio" id="level3" name="level">
                         Website Suggestion</label>
                </fieldset>
                <label for="message">message</label>
                <textarea id="message" name="messenge"></textarea>
                <label for="checkbox">
                      <input type="checkbox" id="checkbox" name="newletter">
                      Please subscribe me to the monthly newletter
                </label>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>   
        <div class="Team section">
           <h2> We Are Here to serve You</h2>
           <div class="team-cards">
                <figure>
                  <img src="images/employee1.jpg" alt="Olak Peter, Lead Rafting Guide">
                  <figcaption>Olak Peter – Lead Rafting Guide</figcaption>
               </figure>
               <figure>
                 <img src="images/employee2.jpg" alt="Sarah Namanzi, River Instructor">
                 <figcaption>Sarah Namanzi – River Instructor</figcaption>
               </figure>
               <figure>
                 <img src="images/employee3.jpg" alt="Asimwe Micheal, Safety Officer">
                 <figcaption>Asimwe Micheal – Safety Officer</figcaption>
               </figure>
            </div> 
        </div>
  </main>   
  <footer>
      <p>© 2026 White Water Rafting  Co.| Byakagaba Wycliff</p>
      <nav class="socialmedia" aria-label="Social media links">
           <a href="https://facebook.com">
           <img src="images/facebook.jpeg" alt="Facebook" width="32" height="32">
          </a>
          <a href="https://linkedin.com">
            <img src="images/linkin.jpeg" alt="LinkedIn" width="32" height="32">
          </a>
          <a href="https://instagram.com">
            <img src="images/instagram.jpeg" alt="Instagram" width="32" height="32">
        </a>
     </nav>
  </footer>
</body>
</html>
