<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Company</title>
    <meta name="description" 
          content="Contact White Water Rafting Company for inquiries, reservations, or customer support. Reach us by phone, email, or visit our location.">
    <meta name="author" content="Wycliff Byakagaba">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

   <header class="header-grid">
        <img src="images/log.jpeg" alt="White Water Rafting Company Logo" width="100" height="100">
        <nav class="main-nav" aria-label="Main site navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About Us</a>
          <a href="trips.html">Trips</a>
          <a href="contact.html">Contact Us</a>
       </nav>
    </header>
<main>

    <!-- Company Information -->
    <section class="company-info">
          <h1>White Water Rafting Company</h1>
          <p><strong>Address:</strong> 123 Main River Street</p>
          <p>Jinja City, Uganda</p>
          <p><strong>Phone:</strong> +256 778 436 415</p>
          <p><strong>Email:</strong> info@whitewaterrafting.com</p>
     </section>

       <!-- Map -->
       <section class="contact-section">
           <iframe 
              class="map"
              src="https://www.google.com/maps?q=Jinja%20White%20Water%20Rafting%20Uganda&output=embed"
              width="100%" 
              height="300"
              loading="lazy"
              title="Map showing White Water Rafting in Jinja, Uganda">
            </iframe>
        </section>

       <!-- Contact Form -->
      <section class="contact-form">
          <h2>Get in Touch</h2>

        <form action="#" method="post">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <fieldset>
                <legend>Message Purpose</legend>

                <input type="radio" id="general" name="purpose" value="general" required>
                <label for="general">General Inquiry</label>

                <input type="radio" id="reservation" name="purpose" value="reservation">
                <label for="reservation">Reservation Question</label>

                <input type="radio" id="suggestion" name="purpose" value="suggestion">
                <label for="suggestion">Website Suggestion</label>
            </fieldset>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Please subscribe me to the monthly newsletter</label>

            <button type="submit">Get in Touch!</button>

        </form>
    </section>

  <!-- Team Section -->
    <section class="team-section">
        <h2>We Are Here to Serve You</h2>

        <div class="team-cards">
            <figure>
                <img src="images/employee1.jpg" alt="Olak Peter, Lead Rafting Guide">
                <figcaption>Olak Peter – Lead Rafting Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Sarah Namanzi, River Instructor">
                <figcaption>Sarah Namanzi – River Instructor</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Asimwe Micheal, Safety Officer">
                <figcaption>Asimwe Micheal – Safety Officer</figcaption>
            </figure>
        </div>
    </section>
</main>
<footer>
    <p>© 2026 White Water Rafting Co. | Byakagaba Wycliff</p>

    <nav class="socialmedia">
        <a href="https://facebook.com">
            <img src="images/facebook.jpeg" alt="Facebook"></a>

        <a href="https://linkedin.com">
            <img src="images/linkin.jpeg" alt="LinkedIn"></a>

        <a href="https://instagram.com">
            <img src="images/instagram.jpeg" alt="Instagram"></a>
    </nav>
</footer>
</body>
</html>
