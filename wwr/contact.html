<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | White water rafting Company</title>
    <meta name="description" 
          content="Contact White Water Rafting Company for reservations, questions, and general inquiries.">
    <meta name="author" content="Wycliff Byakagaba">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

     <header class="header-grid">
      <img src="images/log.jpeg" alt="White water rafting company logo" width="100" height="100">
      <nav class="main-nav" aria-label="main site navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
        </nav>
   </header>

 
<main>
   <h1>Contact Us</h1>

    <!-- ===== Company Info + Map (Wireframe Row 1) ===== -->
    <section class="contact-layout">

      <div class="company-info">
        <h2>Our Office</h2>
        <p><strong>Address:</strong> 123 River Road, jinja city, Uganda</p>
        <p><strong>Phone:</strong> +256 778 436 415</p>
        <p><strong>Email:</strong> info@whitewaterrafting.com</p>
      </div>
      
        <div class="map">
        <iframe
          src="https://www.google.com/maps?q=Jinja%20White%20Water%20Rafting%20Uganda&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Map showing White Water Rafting in Jinja, Uganda">
</iframe>

      </div>

    </section>

    <!-- ===== Employees ===== -->
    <section class="employees">
      <h2>Meet Our Team</h2>

      <figure>
        <img src="images/employee1.jpg" alt="olak peter, Lead Rafting Guide">
        <figcaption>olak peter – Lead Rafting Guide</figcaption>
      </figure>

       <figure>
        <img src="images/employee3.jpg" alt="asimwe micheal, Safety Officer">
        <figcaption>Asimwe micheal – Safety Officer</figcaption>
      </figure>

      <figure>
       <img src="images/employee2.jpg" alt="sarah namanzi, River Instructor">
      <figcaption>Sarah namanzi – River Instructor</figcaption>
     </figure>

    </section>

    <!-- ===== Contact Form ===== -->
    <section class="contact-form">
  <h2>Send Us a Message</h2>

  <form action="#" method="post">

    <!-- Text input -->
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <!-- Email input -->
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <!-- Radio buttons -->
    <fieldset>
      <legend>Message Purpose</legend>

      <label for="purpose-general">
        <input type="radio" id="purpose-general" name="purpose" value="general" required>
        General Inquiry
      </label>

      <label for="purpose-reservation">
        <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
        Reservation Question
      </label>

      <label for="purpose-website">
        <input type="radio" id="purpose-website" name="purpose" value="website">
        Website Suggestion
      </label>
    </fieldset>

    <!-- Textarea -->
    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <!-- Checkbox -->
    <label for="newsletter">
      <input type="checkbox" id="newsletter" name="newsletter">
      Please subscribe me to the monthly newsletter
    </label>

    <!-- Submit button -->
    <button type="submit">Send Message</button>

  </form>
</section>
</main>

==================================================================-->

      </a>
  </nav>
</footer>
</body>
</html>
